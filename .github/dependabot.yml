version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Upgrade these together after comparing the target Paseo scaffold/contracts.
      - dependency-name: "@getpaseo/*"
    groups:
      development:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
